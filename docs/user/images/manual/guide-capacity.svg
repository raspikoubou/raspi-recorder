<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="380" viewBox="0 0 1040 380" role="img"><title>空き容量と自動削除・録画停止の関係</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#52616d"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#f2f4f6"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans JP,sans-serif" fill="#17212b"><text x="28" y="38" font-size="25" fill="#17212b" text-anchor="start">容量が減ったときの動き</text><rect x="25" y="95" width="300" height="145" rx="10" fill="white" stroke="#087a3e" stroke-width="2"/><text x="43" y="127" font-size="21" fill="#087a3e" text-anchor="start">通常の録画</text><text x="43" y="157" font-size="16" fill="#17212b" text-anchor="start">空きが削除開始値以上</text><text x="43" y="182" font-size="16" fill="#17212b" text-anchor="start">そのまま録画を続ける</text><rect x="370" y="95" width="300" height="145" rx="10" fill="white" stroke="#986500" stroke-width="2"/><text x="388" y="127" font-size="21" fill="#986500" text-anchor="start">自動削除</text><text x="388" y="157" font-size="16" fill="#17212b" text-anchor="start">削除開始値を下回る</text><text x="388" y="182" font-size="16" fill="#17212b" text-anchor="start">古い正常確定済み録画を削除</text><text x="388" y="207" font-size="16" fill="#17212b" text-anchor="start">回復目標の空きを目指す</text><rect x="715" y="95" width="300" height="145" rx="10" fill="white" stroke="#b4232d" stroke-width="2"/><text x="733" y="127" font-size="21" fill="#b4232d" text-anchor="start">録画を停止</text><text x="733" y="157" font-size="16" fill="#17212b" text-anchor="start">microSD：空き2GB以下</text><text x="733" y="182" font-size="16" fill="#17212b" text-anchor="start">USB：空き1GB以下</text><text x="733" y="207" font-size="16" fill="#17212b" text-anchor="start">保存先・容量を確認する</text><path d="M325,160 L370,160" stroke="#52616d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M670,160 L715,160" stroke="#52616d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="328" y="143" font-size="14" fill="#17212b" text-anchor="start">低下</text><text x="672" y="143" font-size="14" fill="#17212b" text-anchor="start">低下</text><path d="M520,245 L520,290 L175,290 L175,245" stroke="#087a3e" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="225" y="281" font-size="16" fill="#087a3e" text-anchor="start">回復目標以上まで空きを確保</text><text x="28" y="340" font-size="17" fill="#17212b" text-anchor="start">削除開始・回復目標は設定で変更できます。初期値は削除開始5GB・回復目標7GBです。</text><text x="28" y="368" font-size="16" fill="#17212b" text-anchor="start">削除できる録画が足りない等、空きを確保できない場合にも停止することがあります。</text></g></svg>