<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="370" viewBox="0 0 1040 370" role="img"><title>ソフトウェア更新の進み方</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#52616d"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#f2f4f6"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans JP,sans-serif" fill="#17212b"><text x="28" y="38" font-size="25" fill="#17212b" text-anchor="start">ソフトウェア更新の進み方</text><rect x="25" y="85" width="225" height="125" rx="10" fill="white" stroke="#075ea8" stroke-width="2"/><text x="43" y="117" font-size="21" fill="#075ea8" text-anchor="start">1. 取得・照合</text><text x="43" y="147" font-size="16" fill="#17212b" text-anchor="start">公開版を取得</text><text x="43" y="172" font-size="16" fill="#17212b" text-anchor="start">ファイルを検査</text><path d="M250,145 L275,145" stroke="#52616d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="280" y="85" width="225" height="125" rx="10" fill="white" stroke="#075ea8" stroke-width="2"/><text x="298" y="117" font-size="21" fill="#075ea8" text-anchor="start">2. 構築</text><text x="298" y="147" font-size="16" fill="#17212b" text-anchor="start">必要なライブラリを準備</text><text x="298" y="172" font-size="16" fill="#17212b" text-anchor="start">この間は旧版で録画</text><path d="M505,145 L530,145" stroke="#52616d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="535" y="85" width="225" height="125" rx="10" fill="white" stroke="#075ea8" stroke-width="2"/><text x="553" y="117" font-size="21" fill="#075ea8" text-anchor="start">3. 切り替え</text><text x="553" y="147" font-size="16" fill="#17212b" text-anchor="start">録画を確定して一時停止</text><text x="553" y="172" font-size="16" fill="#17212b" text-anchor="start">新しい版へ切り替え</text><path d="M760,145 L785,145" stroke="#52616d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="790" y="85" width="225" height="125" rx="10" fill="white" stroke="#075ea8" stroke-width="2"/><text x="808" y="117" font-size="21" fill="#075ea8" text-anchor="start">4. 起動確認</text><text x="808" y="147" font-size="16" fill="#17212b" text-anchor="start">サービスの状態を確認</text><text x="808" y="172" font-size="16" fill="#17212b" text-anchor="start">成功後に画面へ戻る</text><rect x="260" y="265" width="745" height="76" rx="10" fill="white" stroke="#b4232d" stroke-width="2"/><text x="278" y="297" font-size="21" fill="#b4232d" text-anchor="start">失敗したとき</text><text x="278" y="327" font-size="16" fill="#17212b" text-anchor="start">復帰処理が動きます。接続が戻らない場合は状態を確認します。</text><path d="M650,215 L650,255" stroke="#b4232d" stroke-width="2" fill="none" marker-end="url(#arrow)"/></g></svg>