<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img"><title>カメラ・Pi・保存先・閲覧端末の接続関係</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#52616d"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#f2f4f6"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans JP,sans-serif" fill="#17212b"><text x="30" y="38" font-size="24" fill="#17212b" text-anchor="start">① 撮影 → ② Piで保存 → ③ ブラウザで見る</text><rect x="30" y="80" width="220" height="120" rx="10" fill="white" stroke="#075ea8" stroke-width="2"/><text x="48" y="112" font-size="21" fill="#075ea8" text-anchor="start">USBカメラ</text><text x="48" y="142" font-size="16" fill="#17212b" text-anchor="start">1〜2台をUSBで接続</text><text x="48" y="167" font-size="16" fill="#17212b" text-anchor="start">対応カメラは録音も可能</text><rect x="380" y="80" width="260" height="140" rx="10" fill="white" stroke="#075ea8" stroke-width="2"/><text x="398" y="112" font-size="21" fill="#075ea8" text-anchor="start">Raspberry Pi 5</text><text x="398" y="142" font-size="16" fill="#17212b" text-anchor="start">録画を動かす本体</text><text x="398" y="167" font-size="16" fill="#17212b" text-anchor="start">microSDにOSを導入</text><text x="398" y="192" font-size="16" fill="#17212b" text-anchor="start">電源・冷却も用意</text><rect x="760" y="80" width="210" height="120" rx="10" fill="white" stroke="#075ea8" stroke-width="2"/><text x="778" y="112" font-size="21" fill="#075ea8" text-anchor="start">microSD</text><text x="778" y="142" font-size="16" fill="#17212b" text-anchor="start">OS・設定・録画</text><text x="778" y="167" font-size="16" fill="#17212b" text-anchor="start">初期の保存先</text><path d="M250,140 L380,140" stroke="#52616d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="280" y="126" font-size="16" fill="#17212b" text-anchor="start">USB</text><path d="M640,140 L760,140" stroke="#52616d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="760" y="310" width="210" height="120" rx="10" fill="white" stroke="#075ea8" stroke-width="2"/><text x="778" y="342" font-size="21" fill="#075ea8" text-anchor="start">USB保存媒体</text><text x="778" y="372" font-size="16" fill="#17212b" text-anchor="start">任意・別途準備</text><text x="778" y="397" font-size="16" fill="#17212b" text-anchor="start">ext4 / exFAT</text><path d="M640,190 L760,330" stroke="#52616d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="380" y="310" width="260" height="120" rx="10" fill="white" stroke="#087a3e" stroke-width="2"/><text x="398" y="342" font-size="21" fill="#087a3e" text-anchor="start">同じLAN</text><text x="398" y="372" font-size="16" fill="#17212b" text-anchor="start">有線LAN または Wi-Fi</text><text x="398" y="397" font-size="16" fill="#17212b" text-anchor="start">ルーターを経由</text><rect x="30" y="310" width="220" height="120" rx="10" fill="white" stroke="#087a3e" stroke-width="2"/><text x="48" y="342" font-size="21" fill="#087a3e" text-anchor="start">PC・スマートフォン</text><text x="48" y="372" font-size="16" fill="#17212b" text-anchor="start">ブラウザで閲覧・設定</text><text x="48" y="397" font-size="16" fill="#17212b" text-anchor="start">専用アプリは不要</text><path d="M510,310 L510,220" stroke="#52616d" stroke-width="2" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/><path d="M250,370 L380,370" stroke="#52616d" stroke-width="2" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="30" y="484" font-size="18" fill="#17212b" text-anchor="start">Web画面： http://自分のPiのホスト名.local:8080/　（信頼できるLAN内で利用）</text></g></svg>