<svg xmlns="http://www.w3.org/2000/svg" width="900" height="820" viewBox="0 0 900 820" role="img"><title>新規導入の6つの工程</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#52616d"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#f2f4f6"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans JP,sans-serif" fill="#17212b"><text x="28" y="40" font-size="26" fill="#17212b" text-anchor="start">最初の録画までの道順</text><rect x="28" y="70" width="150" height="86" rx="10" fill="white" stroke="#075ea8" stroke-width="2"/><text x="46" y="102" font-size="21" fill="#075ea8" text-anchor="start">PC</text><text x="55" y="138" font-size="15" fill="#075ea8" text-anchor="start">STEP 1</text><rect x="205" y="70" width="665" height="86" rx="10" fill="white" stroke="#075ea8" stroke-width="2"/><text x="223" y="102" font-size="21" fill="#075ea8" text-anchor="start">SDを作る</text><text x="223" y="132" font-size="16" fill="#17212b" text-anchor="start">ImagerでOS・名前・SSHを設定する</text><path d="M535,160 L535,186" stroke="#52616d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="28" y="190" width="150" height="86" rx="10" fill="white" stroke="#087a3e" stroke-width="2"/><text x="46" y="222" font-size="21" fill="#087a3e" text-anchor="start">Pi</text><text x="55" y="258" font-size="15" fill="#087a3e" text-anchor="start">STEP 2</text><rect x="205" y="190" width="665" height="86" rx="10" fill="white" stroke="#087a3e" stroke-width="2"/><text x="223" y="222" font-size="21" fill="#087a3e" text-anchor="start">つないで起動</text><text x="223" y="252" font-size="16" fill="#17212b" text-anchor="start">SD・USBカメラ・LANを接続し、電源を入れる</text><path d="M535,280 L535,306" stroke="#52616d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="28" y="310" width="150" height="86" rx="10" fill="white" stroke="#075ea8" stroke-width="2"/><text x="46" y="342" font-size="21" fill="#075ea8" text-anchor="start">PC → Pi</text><text x="55" y="378" font-size="15" fill="#075ea8" text-anchor="start">STEP 3</text><rect x="205" y="310" width="665" height="86" rx="10" fill="white" stroke="#075ea8" stroke-width="2"/><text x="223" y="342" font-size="21" fill="#075ea8" text-anchor="start">SSHで入る</text><text x="223" y="372" font-size="16" fill="#17212b" text-anchor="start">Piの入力待ちになったことを確認する</text><path d="M535,400 L535,426" stroke="#52616d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="28" y="430" width="150" height="86" rx="10" fill="white" stroke="#087a3e" stroke-width="2"/><text x="46" y="462" font-size="21" fill="#087a3e" text-anchor="start">Pi</text><text x="55" y="498" font-size="15" fill="#087a3e" text-anchor="start">STEP 4</text><rect x="205" y="430" width="665" height="86" rx="10" fill="white" stroke="#087a3e" stroke-width="2"/><text x="223" y="462" font-size="21" fill="#087a3e" text-anchor="start">ソフトを導入</text><text x="223" y="492" font-size="16" fill="#17212b" text-anchor="start">配布物を取得・照合し、インストールする</text><path d="M535,520 L535,546" stroke="#52616d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="28" y="550" width="150" height="86" rx="10" fill="white" stroke="#6941a5" stroke-width="2"/><text x="46" y="582" font-size="21" fill="#6941a5" text-anchor="start">ブラウザ</text><text x="55" y="618" font-size="15" fill="#6941a5" text-anchor="start">STEP 5</text><rect x="205" y="550" width="665" height="86" rx="10" fill="white" stroke="#6941a5" stroke-width="2"/><text x="223" y="582" font-size="21" fill="#6941a5" text-anchor="start">最初の録画を確認</text><text x="223" y="612" font-size="16" fill="#17212b" text-anchor="start">保存先・カメラ・保護を設定し、再生・保存する</text><path d="M535,640 L535,666" stroke="#52616d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="28" y="670" width="150" height="86" rx="10" fill="white" stroke="#087a3e" stroke-width="2"/><text x="46" y="702" font-size="21" fill="#087a3e" text-anchor="start">Pi</text><text x="55" y="738" font-size="15" fill="#087a3e" text-anchor="start">STEP 6</text><rect x="205" y="670" width="665" height="86" rx="10" fill="white" stroke="#087a3e" stroke-width="2"/><text x="223" y="702" font-size="21" fill="#087a3e" text-anchor="start">自動起動を有効にする</text><text x="223" y="732" font-size="16" fill="#17212b" text-anchor="start">再起動後も録画中になることを確かめる</text></g></svg>