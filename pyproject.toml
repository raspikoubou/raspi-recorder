[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "raspi-recorder"
version = "0.1.37"
description = "Raspberry Pi設備用ドライブレコーダー"
requires-python = ">=3.13,<3.14"
dependencies = [
    "av==15.0.0",
    "blinker==1.9.0",
    "click==8.5.0",
    "Flask==3.1.3",
    "gunicorn==26.2.0",
    "itsdangerous==2.2.0",
    "Jinja2==3.1.6",
    "MarkupSafe==3.0.4",
    "Pillow==12.3.0",
    "Werkzeug==3.1.9",
]

[project.scripts]
raspi-recorder = "raspi_recorder.cli:main"

[project.optional-dependencies]
browser = [
    "playwright==1.64.1",
]
dev = [
    "mypy==2.4.0",
    "pytest==9.1.1",
    "ruff==0.17.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
raspi_recorder = [
    "templates/*.html",
    "static/*.css",
    "static/*.js",
    "static/vendor/*",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration", "tests/web"]
pythonpath = ["src", "."]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
files = ["src"]
strict = true
